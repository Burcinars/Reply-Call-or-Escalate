<script>
var SCENARIOS = [{"id": "glenn", "color": "lav", "title": "The boss", "subtitle": "Sarah, Ms. Glenn, and the 3:00 print deadline", "you": "You are <b>Sarah</b>, a program assistant in the College Outreach Office at a community college. First full time job. Eight months in.", "people": ["<b>Ms. Glenn</b>, Director of Outreach. Your boss. Fourteen years at the college. In meetings most of the day. Has said more than once that she does not like \"being pulled into small things.\"", "<b>Kevin Martinez</b>, Communications. Friendly. Approves anything with the college logo, so he sees every flyer before it prints.", "<b>Dr. Alvarez</b>, Dean of Students. Ms. Glenn's boss. You have met her twice, both times in a hallway."], "history": "In <b>April</b>, your second month, the spring flyer went out with the <b>wrong room number</b>. 250 copies, reprinted, <b>$180</b> from the office budget. You had emailed Ms. Glenn to confirm the room. No reply came. You used last year's room. At the May staff meeting she mentioned \"a reprint we could have avoided.\" She did not say your name. Everyone knew.", "clock": "<b>Wednesday, 11:40 AM.</b> The Parent Night flyer is done except for <b>four details</b>. Campus Print needs the final PDF by <b>3:00 PM today</b> for 300 copies by Friday. Miss it and the next slot is Monday, so flyers reach families two days before the event instead of a week.", "need": ["<b>RSVP link.</b> The web page goes live Friday. Print the link now, or print \"RSVP at the Outreach Office\"?", "<b>Speaker title.</b> The draft says \"Dr. Reyes, Director of Community Programs.\" You think her title became Dean in June.", "<b>Childcare hours.</b> Ms. Glenn's email last week said 6:00 to 8:30 PM. The childcare contract says 6:00 to 8:00.", "<b>Spanish version.</b> Same print run (adds two days) or online only?"], "your_message": {"meta": "<b>To:</b> Ms. Glenn · 10:55 AM · <b>Subject:</b> Finalizing Parent Info Flyer – Quick Questions", "body": "Hi Ms. Glenn,<br><br>I'm almost finished with the flyer for the October parent event, and just had a few quick things I wanted to check with you before sending it to print.<br><br>Should we include the RSVP link yet, or wait until it's live on the site? Do we have final wording for the guest speaker's name and title? And is the childcare information still confirmed for 6:00 to 8:30 PM? Also, I wasn't sure if we're doing the Spanish version in the same run.<br><br>If it's easier, I can just swing by or give you a quick call, totally up to you. Just didn't want to make guesses on details that might change.<br><br>Thank you so much!<br>Sarah"}, "taps": [{"text": "Quick Questions", "where": "subject line", "why": "\"Quick\" says small. Small things can wait. The subject line does not say print, 3:00, or decision."}, {"text": "just had a few quick things", "where": "first sentence", "why": "\"Just\" and \"quick\" shrink the ask before it is made. Four decisions became a few quick things."}, {"text": "I wanted to check with you", "where": "first sentence", "why": "Checking with is not asking for. It sounds like Sarah has already decided and is being polite."}, {"text": "I wasn't sure if", "where": "fourth question", "why": "Sarah's doubt is now the subject of the sentence, not the Spanish version."}, {"text": "If it's easier", "where": "closing", "why": "Apologizes for asking at all. It tells Ms. Glenn the email is a bother."}, {"text": "totally up to you", "where": "closing", "why": "Hands her permission not to decide. She took it: \"I trust your judgment.\""}, {"text": "Just didn't want to make guesses", "where": "closing", "why": "Says why Sarah is writing instead of what she needs. Nobody has to act on a feeling."}, {"text": "No deadline anywhere", "where": "the whole email", "why": "The 3:00 print is the one fact that would make Ms. Glenn answer today. It is not in the email. Nothing says today."}], "sort": [{"item": "RSVP link: print it now, or print \"RSVP at the Outreach Office\"?", "answer": "glenn", "note": "This one is hers. It is a choice about how the office wants to look, and only she can make it."}, {"item": "Speaker title: Director or Dean?", "answer": "me", "note": "The college website lists Dr. Reyes as Dean of Community Programs since June. Thirty seconds."}, {"item": "Childcare hours: 6:00 to 8:30, or 6:00 to 8:00?", "answer": "me", "note": "The childcare contract is in the shared drive. The contract wins over an old email."}, {"item": "Spanish version: same print run, or online only?", "answer": "me", "note": "Post it online today. Print it later if she wants. Costs nothing and holds nothing up."}], "their_message": {"meta": "<b>From:</b> Ms. Glenn · 11:38 AM", "body": "Hi Sarah,<br><br>Thanks for staying on top of the flyer. I'm glad you're thinking about these kinds of things. That shows initiative.<br><br>Let's aim to make this round smoother than last time. I trust you'll use your best judgment with the info we have. These kinds of small edits shouldn't hold us back from moving forward.<br><br>Please keep me posted once the final version goes out.<br><br>Best,<br>M. Glenn"}, "fork_question": "It is 11:45. Four questions, zero answers, 3:00 print. What do you do?", "doors": [{"key": "A", "label": "Reply by email again, shorter.", "sub": "One yes or no question, answer by 2:00.", "consequence": "You send it at 11:52: \"One thing only you can call: print the RSVP link, or print 'RSVP at the Outreach Office'? If I do not hear back by 2:00 I will print the Outreach Office line.\" 12:30, nothing. 1:45, nothing. At <b>2:05</b> a one line reply arrives: \"Link is fine.\" One answer. The other three are still yours to call.", "fork_question": "It is 2:06. What now?", "options": [{"key": "A1", "label": "Decide the other three yourself and send the proof at 2:45. Tell her what you chose.", "outcome": "The proof goes at 2:45. Thursday 9:05 AM: \"Thanks for the proof. Looks fine. Next time, let's not need quite so many check ins before a print run.\" Friday, Dr. Reyes's office emails Ms. Glenn: the flyer says Director; she has been Dean since June. Ms. Glenn forwards it to you with one line: \"Please see below.\"", "cost": "Flyer printed on time. One wrong title with the college logo on it, and it has your name on it in her mind, not hers."}, {"key": "A2", "label": "Walk to her office now.", "outcome": "Her door is closed. Her assistant says she is in a budget meeting until 2:30. You wait in the hallway. At <b>2:36</b> she comes out, gives you all three answers in ninety seconds, and adds, \"You could have just emailed me.\" The proof goes to print at 2:58.", "cost": "Flyer right and on time. Thirty minutes of your afternoon in a hallway, and a line that stings because you did email her. Twice."}, {"key": "A3", "label": "Wait. She answered once, she will answer the rest.", "outcome": "2:30, nothing. 2:50, nothing. You call Campus Print at 2:55 and ask for ten more minutes. They say the slot is gone. The flyer prints <b>Monday</b>. Families get it two days before the event. Monday 4:10 PM, Ms. Glenn: \"Why did the flyers go out so late?\"", "cost": "Nothing wrong on the flyer. Everything wrong on the calendar, and the question lands on you."}]}, {"key": "B", "label": "Walk to her office.", "sub": "Two minutes, face to face.", "consequence": "11:50. Her door is closed. Her assistant, Dana, says she is in a meeting with the Dean until <b>2:30</b> and \"she asked not to be interrupted.\"", "fork_question": "It is 11:52. What now?", "options": [{"key": "B1", "label": "Go back to your desk and send the \"I will go ahead unless I hear otherwise\" email with your four backup choices and a 2:00 cutoff.", "outcome": "No reply by 2:00. You send the proof at 2:05 with the four choices you named. At 2:40 she replies: \"Looks fine.\" The flyer prints at 2:58. Thursday 9:05 AM: \"Next time, let's not need quite so many check ins before a print run.\"", "cost": "Flyer right, on time, and your email shows you asked and said what you would do. The Thursday note still comes."}, {"key": "B2", "label": "Ask Dana to get one answer for you: the RSVP link, by phone, during a break.", "outcome": "Dana texts Ms. Glenn at 12:30. Ms. Glenn texts back at 1:15: \"Link.\" Dana adds, quietly, \"She asked why you didn't just decide.\" You decide the other three from the contract and the website and send the proof at 2:20.", "cost": "Flyer on time. You now owe Dana one, and Ms. Glenn has a new sentence about you."}, {"key": "B3", "label": "Wait by her door at 2:30.", "outcome": "The meeting runs long. At <b>2:44</b> she walks out with the Dean beside her. You ask your four questions in the hallway in front of Dr. Alvarez. Ms. Glenn answers all four in under a minute, pleasantly. In her office at 3:30 she says, \"Please do not bring flyer details up in front of the Dean.\"", "cost": "Flyer right and on time. You spent an afternoon waiting, and you embarrassed her without meaning to."}]}, {"key": "C", "label": "Send an \"I will go ahead unless I hear otherwise\" email.", "sub": "Name your backup choice for each item and a 2:00 cutoff.", "consequence": "You send it at 11:55. For each of the four you write what you will do if you hear nothing by 2:00: Outreach Office line for the RSVP, Dean from the website, 6:00 to 8:00 from the contract, Spanish online only for now. 1:58, no reply. You send the proof at 2:02. At 2:40: \"Looks fine.\" Flyer prints at 2:58. <b>Thursday 9:05 AM:</b> \"Thanks for the proof. Next time, let's not need quite so many check ins before a print run.\"", "fork_question": "The flyer is done. The note is here. This is the third time in eight months. What do you do with it?", "options": [{"key": "C1", "label": "Reply: \"Thanks, glad it worked. Going forward I will send decisions as a yes or no so they take ten seconds.\"", "outcome": "No reply. Two weeks later you send the next flyer with one yes or no line. She answers in four minutes.", "cost": "You answered the complaint by removing the thing she complained about. The pattern may not change. Your side of it did."}, {"key": "C2", "label": "Do not reply. Write a dated note for yourself: what was asked, what was answered, what happened.", "outcome": "Nothing happens, which is the point. In December, when your six month review says \"needs less hand holding,\" you have three dated notes showing three deadlines met with zero answers from her.", "cost": "Nothing today. A record for later. It only helps if you ever need it."}, {"key": "C3", "label": "Reply: \"I asked four times before the deadline and received no answers. I am not sure how to need fewer check ins.\"", "outcome": "Every word is true. She replies at 10:40: \"Sarah, I think we have different expectations about independence in this role. Let's discuss at your next check in.\" The thread is now about your tone.", "cost": "You were right. You are also the problem now, on paper."}]}, {"key": "D", "label": "Copy Kevin in Communications on a short reply.", "sub": "He approves the flyer anyway and can confirm the title.", "consequence": "You reply at 11:58 with the four questions and add Kevin. Kevin answers in ten minutes: title is Dean, and he will check the childcare contract. At <b>12:40</b> Ms. Glenn replies to all: \"Kevin, thanks. Sarah, in future let's keep these within the office.\"", "fork_question": "It is 12:41. Kevin is reading the same email. What now?", "options": [{"key": "D1", "label": "Reply to Ms. Glenn only: \"Understood. I included Kevin because he approves the logo. I will keep it within the office next time.\"", "outcome": "No reply. You finish the flyer with Kevin's answers and print at 2:50. Kevin stops by Thursday: \"Everything OK with Marianne?\"", "cost": "Flyer right and on time. A small apology for something that was not wrong. Kevin now knows there is weather between you and your boss."}, {"key": "D2", "label": "Reply to all, briefly, explaining why Kevin was needed.", "outcome": "Ms. Glenn does not reply. Kevin replies: \"All good on my end!\" Friday, Dr. Alvarez's assistant asks Kevin why the Outreach Office is \"airing things on email.\"", "cost": "Flyer on time. The thread traveled further than you did."}, {"key": "D3", "label": "Say nothing. Send the proof.", "outcome": "Flyer prints at 2:50 with the right title. Ms. Glenn's \"keep these within the office\" stays the last word on the thread, forever, where Kevin can see it.", "cost": "Flyer right. Silence read as agreement that you did something wrong."}]}, {"key": "E", "label": "Say nothing and use your best judgment.", "sub": "She said to. Decide all four and print.", "consequence": "You pick: Outreach Office line, Dean, 6:00 to 8:30 (her email was more recent than the contract), Spanish online only. The proof goes at 1:30. Prints at 2:58. Two weeks later, <b>event night</b>: at 8:00 the childcare provider packs up, contract hours. Nine parents are still in the gym until 8:30 with nowhere for their kids. At 8:40 Ms. Glenn finds you: \"I trusted your judgment on this.\"", "fork_question": "It is 8:41 on event night. What do you say?", "options": [{"key": "E1", "label": "Own it: \"That one was my call and it was wrong. I will write up what happened and how to avoid it.\"", "outcome": "She nods. Monday you send a one page note with a fix: a decisions checklist signed off two days before any print. She replies \"Good.\" The childcare provider is not happy, but the write up is yours and it is clean.", "cost": "One bad night. One clean paper trail. The pattern of unanswered emails is untouched."}, {"key": "E2", "label": "Point to the email: \"I asked you on the 11th and you said to use my judgment.\"", "outcome": "True. She says, \"And your judgment was wrong.\" Conversation over. In your review: \"deflects responsibility.\"", "cost": "You were right about the facts and lost the room."}, {"key": "E3", "label": "Say sorry and nothing else.", "outcome": "She says, \"We'll talk Monday.\" Monday never comes up. The story that survives in the office is the one where Sarah printed the wrong hours.", "cost": "Quiet. No fix, no record, and the story is not yours."}]}, {"key": "F", "label": "Go to Dr. Alvarez, the boss's boss.", "sub": "She would answer. You are eight months in.", "consequence": "You email Dr. Alvarez at 11:57 with the four questions and the 3:00 deadline. She answers in <b>six minutes</b>, all four, and copies Ms. Glenn: \"Marianne, Sarah needed these for the 3 PM print.\" The flyer prints at 2:58, perfect. At <b>3:15</b> Ms. Glenn asks you to come to her office.", "fork_question": "You are in her office. She says, \"You went to the Dean about a flyer.\" What do you say?", "options": [{"key": "F1", "label": "Calm and factual: \"I had a 3:00 print and no answers by noon. I should have told you I was going to ask her. I will next time.\"", "outcome": "She says, \"Next time, ask me.\" You say you did. She says, \"Ask me in person.\" You leave with the flyer done and a boss who now watches your email for the next three months.", "cost": "Flyer perfect. Trust spent. Buying it back takes months."}, {"key": "F2", "label": "Apologize fully.", "outcome": "\"I understand. It will not happen again.\" She softens. The next flyer, you email her four questions. No reply by the deadline. You print on your own judgment and get the title wrong.", "cost": "Peace today. The original problem is exactly where it was."}, {"key": "F3", "label": "\"With respect, I would do it again. The flyer had to print.\"", "outcome": "Silence. Then: \"Thank you, Sarah.\" Your December review mentions \"challenges with chain of command.\" Dr. Alvarez, who liked your email, never hears that part.", "cost": "Honest. Expensive. Nobody above Ms. Glenn ever sees the bill."}]}], "surprise_prompt": "One thing that surprised you about what happened on the path you took. Two sentences or more."}, {"id": "marcus", "color": "blue", "title": "The coworker", "subtitle": "Jordan, Marcus, and Monday's patients", "you": "You are <b>Jordan</b>, the scheduling coordinator at Riverbend Physical Therapy, a clinic with four therapists and a front office of three. Two years in.", "people": ["<b>Marcus</b>, the billing coordinator. Same level as you, same office manager, desk twelve feet from yours. Six years at Riverbend. Knows insurance better than anyone in the building.", "<b>Dana</b>, the office manager. Both of your boss. Good at her job, allergic to what she calls \"drama.\"", "<b>Three new patients</b> on Monday's schedule whose insurance plans may need prior approval. Without it, their visits get cancelled Monday morning or they get a bill they did not expect."], "history": "In <b>August</b> you asked Dana to \"remind Marcus\" to answer scheduling questions faster. Dana did. Marcus found out it came from you. He has been polite since. Very polite.", "clock": "<b>Thursday, 10:15 AM.</b> You emailed Marcus Wednesday at 9:00 asking him to confirm whether the three plans need prior approval. You need the answer by <b>Friday 5:00 PM</b> so you can call the patients before the weekend. His reply just came in.", "need": ["<b>Patient 1, Aetna plan.</b> Prior approval needed, yes or no?", "<b>Patient 2, UnitedHealthcare plan.</b> Prior approval needed, yes or no?", "<b>Patient 3, Medicaid.</b> Prior approval needed, yes or no?", "If yes on any of them, the approval takes <b>two business days</b>, so Friday is already late."], "your_message": {"meta": "<b>To:</b> Marcus · Wednesday 9:00 AM · <b>Subject:</b> Prior approval check for 3 new patients (Monday appointments)", "body": "Hi Marcus,<br><br>Three new patients are booked for Monday. Could you confirm whether their plans need prior approval? Patient names and plans are in the attached list. I need to call them by Friday at 5:00 if anything has to move.<br><br>Thanks,<br>Jordan"}, "their_message": {"meta": "<b>From:</b> Marcus · Thursday 10:15 AM", "body": "Hi Jordan,<br><br>Not sure why this keeps landing on my desk, but sure. I'll take a look when I get a minute. Some of us have actual deadlines too 🙂<br><br>Marcus"}, "fork_question": "It is 10:16 Thursday. Three patients, zero answers, Friday 5:00. What do you do?", "doors": [{"key": "A", "label": "Reply by email, short and specific.", "sub": "Three yes or no lines, needed by Thursday 3:00.", "consequence": "10:25: \"Thanks Marcus. Three yes or no lines are all I need: Aetna, United, Medicaid. By 3:00 today if possible so approvals can start.\" At <b>2:50</b> he replies: \"Aetna no. United yes. Medicaid, you'd have to call them, that's not really a billing question.\"", "fork_question": "Two answers, one bounced back to you. It is 2:51. What now?", "options": [{"key": "A1", "label": "Call Medicaid yourself. Start the United approval.", "outcome": "Forty minutes on hold. Medicaid: no approval needed. You start the United approval at 3:40; it clears Monday at 8:15 AM, ten minutes before the patient arrives. All three visits happen.", "cost": "Monday saved. You did part of his job. He knows you did, and so does Dana, because the approval has your name on it."}, {"key": "A2", "label": "Reply: \"Medicaid approvals are billing. Could you call them? I will start United.\"", "outcome": "No reply Thursday. Friday 11:00: \"Called. No approval needed. In the future please check the plan list on the shared drive before asking.\" There is a plan list on the shared drive. You did not know.", "cost": "Monday saved. You learned where the list is the hard way, in writing, from him."}, {"key": "A3", "label": "Walk over with the Medicaid question.", "outcome": "\"Not really a billing question\" turns out to mean \"I am tired of being asked.\" Face to face he sighs, pulls up the plan list, and answers in twenty seconds. Then: \"That list is on the shared drive, you know.\"", "cost": "Monday saved in twenty seconds. The dig lands, but now you know about the list, and he saw you ask in person instead of on paper."}]}, {"key": "B", "label": "Walk the twelve feet to his desk.", "sub": "Now, while the email is fresh.", "consequence": "He has headphones on. You wait. He takes one earbud out. You ask for the three answers. He says, \"I'll get to it.\" You say the patients need calls by Friday. He says, \"Jordan, I said I'll get to it,\" at a volume the whole front office hears.", "fork_question": "Dana looked up. The waiting room is twenty feet away. What now?", "options": [{"key": "B1", "label": "Lower your voice: \"Got it. Would 3:00 today work? I can start the approvals from there.\"", "outcome": "He says \"Fine.\" At 3:10 the three answers arrive by email, no greeting, no sign off. United needs approval. You start it. Monday works.", "cost": "Monday saved. The office saw him raise his voice and saw you not match it. That is worth something later."}, {"key": "B2", "label": "Walk away without a word.", "outcome": "No answers Thursday. Friday 4:30, nothing. You cancel Monday's three new patients \"pending insurance.\" One of them does not rebook.", "cost": "Nobody argued. One patient gone. Marcus never had to answer."}, {"key": "B3", "label": "Say, in the same volume: \"I asked yesterday. The patients come Monday.\"", "outcome": "Dana walks over: \"Both of you, my office.\" Ten minutes of \"we are a team here.\" Marcus sends the answers at 4:45 Thursday. Dana's note to both of you Friday: \"Let's keep front office conversations professional.\"", "cost": "Monday saved. You are now half of \"both of you\" in Dana's mind."}]}, {"key": "C", "label": "Do it yourself. Call the three insurers.", "sub": "He is not the only one who can find out.", "consequence": "Three calls, two hours on hold between patients checking in. By 1:30 you have: Aetna no, United yes, Medicaid no. You start the United approval yourself at 1:45 using Marcus's login notes taped inside the cabinet. It clears Monday at 8:15. All three visits happen.", "fork_question": "Monday afternoon Marcus sees the approval in the system with your name on it. He says, \"So you do billing now?\" What do you say?", "options": [{"key": "C1", "label": "\"I needed it by Friday and did not want to keep asking. If I did anything wrong in the system, tell me and I will fix it.\"", "outcome": "He checks. You did it right. He says nothing more. The next time you email him a question he answers the same day.", "cost": "Two hours of your week. A small shift in how he answers you. No fix for the next person he does this to."}, {"key": "C2", "label": "\"Somebody had to.\"", "outcome": "He goes to Dana: \"Jordan is doing approvals under my login.\" Dana to you, 4:00: \"Please do not use anyone else's login. Ever.\" True, and fair.", "cost": "Monday saved. You handed him a real complaint about you, and it stuck."}, {"key": "C3", "label": "\"Yes, when I have to.\"", "outcome": "He laughs, not kindly. For the next month every scheduling question you send him comes back with \"You can probably find that yourself.\"", "cost": "Monday saved. You just told him you do not need him, and he is taking you at your word."}]}, {"key": "D", "label": "Copy Dana on a short reply.", "sub": "She is both your boss. Let her see the deadline.", "consequence": "10:30: \"Hi Marcus, thanks. I need the three yes or no answers by Thursday 3:00 so approvals can start. Copying Dana so she knows Monday's schedule depends on it.\" Marcus replies at 10:34, to all: \"Happy to help, Jordan. For the record I got this yesterday at 9, not last week.\" Dana replies at 10:50, to you only: \"Can you two sort this without me?\"", "fork_question": "It is 10:51. What now?", "options": [{"key": "D1", "label": "Reply to Dana: \"Yes. Sorry for the noise.\" Then walk over to Marcus.", "outcome": "At his desk he says, \"You cc'd Dana.\" You say, \"I did. I should have asked you first.\" He gives you the three answers. United needs approval. Monday works. He does not forget the cc.", "cost": "Monday saved. August happened again, and he knows it."}, {"key": "D2", "label": "Reply to Dana explaining August, and this, and the pattern.", "outcome": "Dana reads it. Friday she moves the prior approval checks to a shared checklist both of you fill in. Marcus's desk gets quieter toward you. The approvals get done.", "cost": "Pattern fixed by a process. Relationship not fixed by anything."}, {"key": "D3", "label": "Reply to all: \"You are right, Wednesday 9 AM. The patients are still Monday.\"", "outcome": "Marcus replies, to all: \"Noted.\" Dana replies to nobody. The three answers arrive Friday at 4:50 PM. You call patients from the parking lot.", "cost": "You won the timeline point. You lost the afternoon and most of Friday."}]}, {"key": "E", "label": "Let it sit. He said he would look.", "sub": "Check again Friday at noon.", "consequence": "Thursday passes. Friday 12:00 you email: \"Any update on the three?\" Friday 4:40: \"Aetna no, United yes, Medicaid no.\" The United approval cannot start before Monday 8:00. It clears Tuesday. The patient arrives Monday at 8:30 and is sent home.", "fork_question": "Monday 8:35. The patient is in the parking lot, upset, with a child in the car. Dana asks what happened. What do you say?", "options": [{"key": "E1", "label": "\"I asked Marcus Wednesday, got the answer Friday at 4:40, and should have escalated Thursday. That is on me.\"", "outcome": "Dana says, \"Thank you for the straight answer.\" She asks Marcus the same question. He says he was busy. Dana sets a 24 hour rule for prior approval questions. The patient rebooks for Tuesday.", "cost": "One patient inconvenienced. A rule that helps the next hundred. You took half the blame that was mostly not yours, and it bought the rule."}, {"key": "E2", "label": "\"Marcus took two days to answer.\"", "outcome": "Marcus, from his desk: \"I answered Friday.\" Dana: \"Jordan, you schedule. If a plan needs approval you ask earlier.\" The patient rebooks. Nothing changes.", "cost": "True. Pointless. Same desk tomorrow."}, {"key": "E3", "label": "\"Insurance delay.\"", "outcome": "Dana accepts it esday 3:11 PM · <b>Tyler</b>", "body": "Sure, I'll redo it AGAIN. Third time's the charm I guess 🙂"}, "fork_question": "It is 3:12. Seven people just read that. The inspection is in sixteen hours. What do you do?", "doors": [{"key": "A", "label": "Reply in the group chat.", "sub": "Everyone saw his message. Everyone sees yours.", "consequence": "You type for a minute. Whatever you send, it sits under his message with seven readers. Two of them already reacted to his with a laughing face.", "fork_question": "What do you send?", "options": [{"key": "A1", "label": "\"Ha, third time it is. I'll be in at 6:45 to check with you. Thanks Tyler.\"", "outcome": "The laughing faces stop. Tyler replies \"👍\". You arrive at 6:45; the wands are clean, mostly. You fix one together in three minutes before the inspector arrives. Pass.", "cost": "Inspection passed. His joke got answered with a joke and a plan. The two of you still have not talked about Monday and Tuesday."}, {"key": "A2", "label": "\"Tyler, the first two did not pass my check. Please follow the checklist tonight.\"", "outcome": "Silence in the chat. Then a private message from Mia, another closer: \"That was kind of harsh in the group.\" Tyler cleans the wands tonight, correctly. Thursday he does not look at you. Friday he asks Rosa to switch him to opens.", "cost": "Inspection passed. You corrected him in front of seven people. The schedule just got harder."}, {"key": "A3", "label": "\"Please keep the chat professional.\"", "outcome": "Tyler: \"Sorry.\" Two people leave the chat open with no reply. The wands get cleaned, correctly. For a month, nobody jokes in the group chat.", "cost": "Inspection passed. The chat went quiet, and quiet chats hide problems."}]}, {"key": "B", "label": "Message him privately.", "sub": "Out of the group. Now.", "consequence": "You open a direct message. He is on his phone; the dots appear and disappear while you type.", "fork_question": "What do you send?", "options": [{"key": "B1", "label": "\"Hey. I know the first two did not pass and that is frustrating. Can you call me for two minutes before your shift? I want to make sure the checklist makes sense.\"", "outcome": "He calls at 3:50. It turns out the wall checklist says \"soak tips\" and nobody told him where the soaking cup is. Three minute call. Tonight the wands pass. Thursday morning he says, \"Told you third time.\"", "cost": "Inspection passed. The real problem was a missing cup, not a lazy barista. You only found out by asking."}, {"key": "B2", "label": "\"That message was not OK in the group chat. Please do the cleaning properly tonight.\"", "outcome": "\"OK.\" The wands are clean Thursday. He is polite for two weeks, exactly polite, and then asks Rosa for fewer hours.", "cost": "Inspection passed. You answered the tone, not the problem, and the problem was never his attitude."}, {"key": "B3", "label": "\"Lol fair. Checklist tonight please, I'll check at 6:45.\"", "outcome": "\"👍\". Thursday 6:45: one wand clean, one with milk film. You clean it yourself in four minutes. Pass. Tyler never learns what he was doing wrong.", "cost": "Inspection passed by you. The fourth time will be the same as the first three."}]}, {"key": "C", "label": "Say nothing now. Talk to him in person at 4:00 before his shift.", "sub": "The dentist can wait ten minutes.", "consequence": "You get to the café at 4:05. He is clocking in. You ask him to step into the back for two minutes.", "fork_question": "What do you open with?", "options": [{"key": "C1", "label": "\"Show me how you have been cleaning the wands.\"", "outcome": "He shows you. He is skipping the soak because the soaking cup is \"always in the dish pit.\" You get the cup, do one wand together, he does the other. Thursday: pass. The group chat message never comes up, and it does not need to.", "cost": "Ten minutes. The inspection, the skill, and the relationship, all handled. The joke in the chat is just a joke now."}, {"key": "C2", "label": "\"The message in the chat. What was that about?\"", "outcome": "\"It was a joke.\" You say it did not read like one. He shrugs. You explain the checklist again. Tonight the wands pass. Thursday he is quiet; Friday he is fine. The soaking cup is still in the dish pit, and next month a new closer skips the soak too.", "cost": "Inspection passed. You handled the tone and missed the cause."}, {"key": "C3", "label": "\"Tonight has to pass. If the wands fail again I will have to take you off closes.\"", "outcome": "He nods. He cleans them for forty minutes, correctly. Thursday: pass. He never jokes with you again and asks Mia, not you, when he has a question.", "cost": "Inspection passed. You used the one tool you had, and it worked, and it cost you the part of him that asks."}]}, {"key": "D", "label": "Let the message go. Check the wands yourself at 6:45 AM.", "sub": "It is a joke. The inspection is the thing.", "consequence": "You leave the chat alone. Two more laughing faces appear. Thursday 6:45 AM: both wands have milk film. You have fifteen minutes. You clean them yourself. The inspector arrives at 7:02. Pass.", "fork_question": "It is 9:00 AM Thursday, after the inspection. Tyler is off until Saturday. What now?", "options": [{"key": "D1", "label": "Message him: \"We passed. Wands had film again, I cleaned them at 6:45. Let's do one together Saturday before open.\"", "outcome": "Saturday, you do one together. He finds out about the soaking cup. Next Wednesday the wands pass your check on the first try.", "cost": "One early morning and a Saturday. He learned it a week late, but he learned it from you."}, {"key": "D2", "label": "Say nothing. It passed.", "outcome": "Next Wednesday: film. The Wednesday after: film. In November the surprise reinspection fails on the steam wands. Rosa asks who closes Wednesdays.", "cost": "Nothing today. Everything in November."}, {"key": "D3", "label": "Tell Rosa Tyler is not following the checklist.", "outcome": "Rosa talks to Tyler Saturday. Tyler to you, Monday: \"You could have just told me.\" He is right.", "cost": "Inspection passed. You skipped a step on the way to the owner, and he noticed."}]}, {"key": "E", "label": "Tell Rosa now.", "sub": "Three failed cleans, a public joke, an inspection tomorrow.", "consequence": "You call Rosa at 3:20 from the dentist's parking lot. She says, \"Do you want me to handle it or do you want to?\"", "fork_question": "What do you say?", "options": [{"key": "E1", "label": "\"I will handle it. I wanted you to know before tomorrow in case it fails.\"", "outcome": "\"Good.\" You message Tyler privately, ask him to call, find out about the soaking cup. Pass. Rosa never mentions it again, except in December: \"You kept me in the loop and handled it. That is what I need.\"", "cost": "One phone call. Rosa saw you escalate the information and keep the problem."}, {"key": "E2", "label": "\"Can you talk to him? He does not listen to me.\"", "outcome": "Rosa messages Tyler. The wands pass. From then on Tyler checks with Rosa, not you, about closes. The crew notices.", "cost": "Inspection passed. You gave Rosa the part of your job that makes it yours."}, {"key": "E3", "label": "\"I think he should be written up for the chat message.\"", "outcome": "Rosa: \"For a joke?\" Pause. \"Clean the wands tonight, Jen. We'll talk about Tyler next week.\" You clean them. The write up never happens. The question of why they keep failing never gets asked.", "cost": "Inspection passed. You asked for a hammer and were handed a sponge."}]}], "surprise_prompt": "One thing that surprised you about what happened on the path you took. Two sentences or more."}];

    '<div class="card peach"><span class="tag ink peach">Story 3 · the person you supervise</span><p>Never correct someone in a group chat; take it private or in person. And before you answer the tone, ask to <b>see the task</b>: "show me how you have been cleaning the wands." The soaking cup was in the dish pit. Most attitude problems you will manage are missing cups.</p></div>' +
    '<div class="card mint"><p><b>One sentence to keep:</b> answer the task first, keep the warmth, name the time, say what you will do if there is no answer, and never defend yourself in writing to someone who is being polite and difficult at the same time.</p></div>' +
    '<p><button class="btn soft" type="button" id="restart">↺ Start over (for practice; your saved result stays)</button></p>';
}

/* ================= WIRING ================= */
function wire(sc){
  if (sc.type === 'start'){ onClick('#goClass', function(){ st.form = {id:'', confirm:false, err:''}; st.view = 'signin'; render(); }); onClick('#goLookup', function(){ st.look = {id:'', out:''}; st.view = 'lookup'; render(); }); }
  if (sc.type === 'messages' && SCENARIOS[sc.s].taps){
    var S = st.stories[sc.s], taps = SCENARIOS[sc.s].taps;
    var paint = function(){ $('#tapcount').textContent = 'Found ' + S.taps.length + ' of ' + taps.length + '.'; $('#tapwhys').innerHTML = S.taps.slice().sort(function(a, b){ return a - b; }).map(function(idx){ var t = taps[idx]; return '<div class="tapwhy reveal"><b>' + esc(t.text) + '</b> <span class="small">(' + esc(t.where) + ')</span><br>' + esc(t.why) + '</div>'; }).join(''); updateNav(); };
    $$('[data-tap]').forEach(function(el){ el.addEventListener('click', function(){ var idx = +el.dataset.tap; if (S.taps.indexOf(idx) < 0){ S.taps.push(idx); el.classList.add('on'); el.classList.remove('show'); save(); paint(); } }); });
    onClick('#tapAll', function(){ S.tapsShown = true; taps.forEach(function(t, idx){ if (S.taps.indexOf(idx) < 0) S.taps.push(idx); }); save(); render(); });
    paint();
  }
  if (sc.type === 'sort'){
    var S2 = st.stories[sc.s];
    $$('[data-sort]').forEach(function(b){ b.addEventListener('click', function(){ S2.sortPicks[b.dataset.sort] = b.dataset.v; save(); render(); }); });
    onClick('#sortGo', function(){ S2.sortDone = true; save(); render(); });
  }
  if (sc.type === 'doors'){
    var S3 = st.stories[sc.s];
    $$('[data-door]').forEach(function(b){ b.addEventListener('click', function(){ S3.door = +b.dataset.door; S3.opt = null; S3.stage = 'cons'; save(); render(); window.scrollTo({top:0}); }); });
    $$('[data-opt]').forEach(function(b){ b.addEventListener('click', function(){ S3.opt = +b.dataset.opt; S3.stage = 'out'; var d = SCENARIOS[sc.s].doors[S3.door], o = d.options[S3.opt]; S3.paths.push([d.key, o.key]); save(); render(); window.scrollTo({top:0}); }); });
    onClick('#backDoors', function(){ S3.stage = 'doors'; S3.door = null; save(); render(); });
    onClick('#tryAnother', function(){ S3.stage = 'doors'; S3.door = null; S3.opt = null; save(); render(); window.scrollTo({top:0}); });
    onClick('#doneDoors', function(){ go(st.i + 1); });
  }
  if (sc.type === 'surprise'){
    var S4 = st.stories[sc.s], ta = $('#surprise');
    var upd = function(){ S4.surprise = ta.value; var w = words(ta.value); $('#surpriseCount').innerHTML = w + ' words' + (w >= MIN.surprise ? ' <span class="ok">✓</span>' : ' · at least ' + MIN.surprise); save(); updateNav(); };
    ta.addEventListener('input', upd); upd();
  }
  if (sc.type === 'rewrite'){
    var ta2 = $('#email');
    var upd2 = function(){ st.email.text = ta2.value; paintEmail(ta2.value); save(); updateNav(); };
    ta2.addEventListener('input', upd2); upd2();
    onClick('#lock', function(){ if (words(st.email.text) < MIN.email) return; st.email.locked = true; save(); render(); });
    onClick('#unlock', function(){ st.email.locked = false; save(); render(); });
  }
  if (sc.type === 'reflect'){
    [1, 2].forEach(function(k){ var t = $('#ref' + k); var u = function(){ st['r' + k] = t.value; var w = words(t.value); $('#refCount' + k).innerHTML = w + ' words' + (w >= MIN.reflect ? ' <span class="ok">✓</span>' : ' · at least ' + MIN.reflect); save(); updateNav(); }; t.addEventListener('input', u); u(); });
  }
  if (sc.type === 'finish'){ onClick('#submitBtn', submitFinal); }
  if (sc.type === 'learn'){ onClick('#restart', function(){ var cls = st.cls; st = fresh(); st.cls = cls; save(); go(0); }); }
}
function analyzeEmail(t){
  var found = [];
  HEDGES.forEach(function(h){ var m = String(t || '').match(h.re); if (m) found.push({t:h.t, n:m.length, why:h.why}); });
  var checks = CHECKS.map(function(c){ return {k:c.k, label:c.label, ok:c.test(String(t || ''))}; });
  return {hedges:found, hedgeCount:found.reduce(function(a, b){ return a + b.n; }, 0), checks:checks, passed:checks.filter(function(c){ return c.ok; }).length, words:words(t)};
}
function paintEmail(t){
  var a = analyzeEmail(t);
  $('#hedges').innerHTML = a.hedges.length ? a.hedges.map(function(h){ return '<span class="hedge">' + esc(h.t) + (h.n > 1 ? ' ×' + h.n : '') + ' · ' + esc(h.why) + '</span>'; }).join('') : '<span class="small ok">none found ✓</span>';
  $('#hedgeNote').textContent = a.hedgeCount ? a.hedgeCount + ' hedge word' + (a.hedgeCount > 1 ? 's' : '') + '. Each one makes the ask smaller.' : 'Clean.';
  $('#checks').innerHTML = a.checks.map(function(c){ return '<li class="' + (c.ok ? 'on' : '') + '">' + esc(c.label) + '</li>'; }).join('');
  $('#emailCount').innerHTML = a.words + ' words' + (a.words >= MIN.email ? ' <span class="ok">✓</span>' : ' · at least ' + MIN.email) + ' · ' + a.passed + ' of ' + a.checks.length + ' checks';
}
function canNext(){
  var sc = SCREENS[st.i];
  if (sc.type === 'start') return isClass();
  if (sc.type === 'messages' && SCENARIOS[sc.s].taps) return st.stories[sc.s].taps.length >= 4;
  if (sc.type === 'sort') return st.stories[sc.s].sortDone;
  if (sc.type === 'doors') return st.stories[sc.s].paths.length > 0 && st.stories[sc.s].stage !== 'cons';
  if (sc.type === 'surprise') return words(st.stories[sc.s].surprise) >= MIN.surprise;
  if (sc.type === 'rewrite') return st.email.locked && words(st.email.text) >= MIN.email;
  if (sc.type === 'reflect') return words(st.r1) >= MIN.reflect && words(st.r2) >= MIN.reflect;
  if (sc.type === 'finish') return !!(st.cls.submitted && st.cls.submitted.ok);
  if (sc.type === 'learn') return false;
  return true;
}
function allDone(){ return st.stories.every(function(S){ return S.paths.length > 0 && words(S.surprise) >= MIN.surprise; }) && st.email.locked && words(st.email.text) >= MIN.email && words(st.r1) >= MIN.reflect && words(st.r2) >= MIN.reflect; }
function updateNav(){
  var sc = SCREENS[st.i], nav = $('#nav');
  nav.style.display = (st.view !== 'pages') ? 'none' : '';
  var nx = $('#next'), bk = $('#back'), hint = $('#hint');
  bk.disabled = st.i === 0;
  var ok = canNext(); nx.disabled = !ok;
  nx.textContent = sc.type === 'finish' ? 'See my result ›' : 'Next ›';
  var hints = {start:(closed() ? 'Closed.' : 'Sign in to begin.'), messages:'Tap at least 4 of the weak spots.', sort:'Sort all four, then press See how it sorts.', doors:'Walk at least one path to the end.', surprise:'Write at least ' + MIN.surprise + ' words.', rewrite:'Write at least ' + MIN.email + ' words and lock it in.', reflect:'Both boxes, ' + MIN.reflect + ' words or more.', finish:'Press Save my work.'};
  hint.textContent = ok ? '' : (hints[sc.type] || '');
  if (sc.type === 'learn'){ nx.style.display = 'none'; } else nx.style.display = '';
}

/* ================= SIGN IN / SUBMIT / LOOKUP ================= */
function secButtons(locked){ return '<div class="secrow">' + Object.keys(CONFIG.SECTIONS).map(function(k){ var s = CONFIG.SECTIONS[k], on = st.cls.section === k; return '<button type="button" class="secbtn' + (on ? ' on' : '') + '" data-sec="' + k + '"' + (locked ? ' disabled' : '') + '><b>' + esc(s.label) + '</b><span>' + esc(s.sub) + '</span></button>'; }).join('') + '</div>'; }
function renderSignin(){
  $('#nav').style.display = 'none';
  var f = st.form || (st.form = {id:'', confirm:false, err:''});
  var h = '<h1>Sign in</h1><p class="lead">Two steps, then the first story.</p>' +
    '<div class="card"><p><b>1. Tap your class.</b></p>' + secButtons(f.confirm) + '</div>' +
    '<div class="card"><label for="sid"><b>2. Type the 8 digit number you log in to Blackboard with.</b></label><p class="small">It is your Student ID. It starts with 0, for example 03083452.</p><input id="sid" class="field" inputmode="numeric" autocomplete="off" maxlength="14" value="' + esc(f.id) + '"' + (f.confirm ? ' readonly' : '') + '></div>' +
    '<div class="err" aria-live="polite">' + esc(f.err || '') + '</div>';
  if (!f.confirm) h += '<p><button type="button" class="btn" id="signNext">Next ›</button> <button type="button" class="btn ghost" id="signBack">‹ Back</button></p>';
  else { var d = normalizeId(f.id); h += '<div class="card butter"><p>You typed:</p><div class="bigid">' + esc(d.slice(0, 4) + ' ' + d.slice(4)) + '</div><p>Is this <b>your</b> Blackboard number? If it is wrong, your points go to no one.</p><p><button type="button" class="btn" id="signYes">Yes, that is me ›</button> <button type="button" class="btn soft" id="signFix">No, let me fix it</button></p></div>'; }
  h += '<div class="card"><b>🔒 What is saved.</b> A scrambled version of your number, your choices, your writing, and the time. Your name is never saved. Your number is never saved the way you typed it.</div>';
  $('#page').innerHTML = h;
  var sid = $('#sid'); if (sid) sid.addEventListener('input', function(){ f.id = sid.value; });
  if (!f.confirm) $$('[data-sec]').forEach(function(b){ b.addEventListener('click', function(){ st.cls.section = b.dataset.sec; f.err = ''; renderSignin(); }); });
  onClick('#signNext', function(){ var d = normalizeId(f.id); if (!st.cls.section){ f.err = 'Step 1 is missing: tap your class.'; renderSignin(); return; } if (d.length !== 8){ f.err = 'Your number needs 8 digits. You typed ' + d.length + '.'; renderSignin(); return; } f.err = ''; f.confirm = true; renderSignin(); });
  onClick('#signFix', function(){ f.confirm = false; renderSignin(); });
  onClick('#signBack', function(){ st.form = null; st.view = 'pages'; render(); });
  onClick('#signYes', signIn);
}
async function signIn(){
  var f = st.form, btn = $('#signYes'), d = normalizeId(f.id);
  btn.disabled = true; btn.textContent = 'One moment…';
  var h1; try { h1 = await sha256Hex(CONFIG.SALT1 + '|' + d); } catch(e){ f.err = 'This browser could not scramble your number. Use Chrome, Safari, or Edge.'; f.confirm = false; renderSignin(); return; }
  var r = await post({action:'start', h1:h1, section:st.cls.section, activity:CONFIG.ACTIVITY, clientVersion:CONFIG.VERSION}, 45000);
  if (r && r.ok && r.already){
    f.err = 'A finished result for this number is already saved. Use "Already finished? See your result" on the start page.'; f.confirm = false; renderSignin(); return;
  }
  var c = st.cls; c.mode = 'class'; c.h1 = h1; c.tail = d.slice(-2); c.recordId = (r && r.ok && r.recordId) || null; c.startedAt = new Date().toISOString();
  st.form = null; st.view = 'pages'; save(); go(1);
}
async function submitFinal(){
  var c = st.cls; if (!isClass() || c.submitting || (c.submitted && c.submitted.ok) || closed()) return;
  c.submitting = true; c.submitError = null; save(); render();
  var a = analyzeEmail(st.email.text);
  var payload = {action:'submit', h1:c.h1, section:c.section, activity:CONFIG.ACTIVITY, clientVersion:CONFIG.VERSION, startedAt:c.startedAt,
    minutes:Math.round((Date.now() - new Date(c.startedAt).getTime()) / 60000),
    paths:st.stories.map(function(S){ return S.paths; }),
    sort:st.stories[0].sortPicks, taps:st.stories[0].taps.length,
    texts:{s1:st.stories[0].surprise, s2:st.stories[1].surprise, s3:st.stories[2].surprise, r1:st.r1, r2:st.r2, email:st.email.text},
    checks:{hedges:a.hedgeCount, passed:a.passed, list:a.checks.map(function(x){ return x.k + ':' + (x.ok ? 1 : 0); }).join(' ')}};
  var r = await post(payload, 60000);
  c.submitting = false;
  if (r && r.ok){ c.submitted = r; c.recordId = r.recordId || c.recordId; c.submitError = null; } else c.submitError = (r && r.error) || 'network';
  save(); render();
}
function renderLookup(){
  $('#nav').style.display = 'none';
  var f = st.look || (st.look = {id:'', out:''});
  var h = '<h1>See your result</h1><p class="lead">Type the same number you used. You will see your paths, your writing, and your score and feedback once graded.</p>' +
    '<div class="card"><p><b>1. Tap your class.</b></p>' + secButtons(false) + '</div>' +
    '<div class="card"><label for="lid"><b>2. Your 8 digit Blackboard number.</b></label><input id="lid" class="field" inputmode="numeric" autocomplete="off" maxlength="14" value="' + esc(f.id) + '"></div>' +
    '<p><button type="button" class="btn" id="lookGo">Show me ›</button> <button type="button" class="btn ghost" id="lookBack">‹ Back</button></p><div id="lookOut">' + f.out + '</div>';
  $('#page').innerHTML = h;
  var lid = $('#lid'); lid.addEventListener('input', function(){ f.id = lid.value; });
  $$('[data-sec]').forEach(function(b){ b.addEventListener('click', function(){ f.id = lid.value; st.cls.section = b.dataset.sec; renderLookup(); }); });
  onClick('#lookBack', function(){ st.look = null; st.view = 'pages'; render(); });
  onClick('#lookGo', async function(){
    var d = normalizeId(f.id), btn = $('#lookGo');
    if (!st.cls.section){ f.out = '<div class="fb miss">Tap your class first.</div>'; renderLookup(); return; }
    if (d.length !== 8){ f.out = '<div class="fb miss">Your number needs 8 digits. You typed ' + d.length + '.</div>'; renderLookup(); return; }
    btn.disabled = true; btn.textContent = 'Looking…';
    var h1; try { h1 = await sha256Hex(CONFIG.SALT1 + '|' + d); } catch(e){ h1 = null; }
    var r = h1 ? await post({action:'lookup', h1:h1, section:st.cls.section, activity:CONFIG.ACTIVITY, clientVersion:CONFIG.VERSION}, 60000) : null;
    if (!r || !r.ok){ f.out = '<div class="fb miss">Could not reach the server. Check the Wi-Fi and try again.</div>'; renderLookup(); return; }
    if (!r.found){ f.out = '<div class="fb note"><b>No record</b> for this number in ' + esc(secLabel(st.cls.section)) + '. If you finished it, email Professor Calafiore with the date and time.</div>'; renderLookup(); return; }
    var x = r.found, fmt = function(iso){ var dd = new Date(iso); return isNaN(dd) ? String(iso) : dd.toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}); };
    var top = x.submittedAt ? '<div class="fb good"><b>✅ Recorded</b> on ' + esc(fmt(x.submittedAt)) + '. Record ID <b>' + esc(x.recordId) + '</b>.</div>' : '<div class="fb note"><b>Started</b> on ' + esc(fmt(x.startedAt)) + ' but <b>not finished</b>.</div>';
    var grade = (x.score != null && x.score !== '') ? '<div class="card butter"><span class="tag ink butter">Your score</span><p><b>' + esc(x.score) + ' out of 10</b></p>' + (x.feedback ? '<p><b>Feedback from Professor Calafiore:</b> ' + esc(x.feedback) + '</p>' : '') + '</div>' : '<p class="small">Not graded yet. Your score will appear here and in Blackboard.</p>';
    f.out = top + grade + (x.submittedAt ? summaryHTML({paths:x.paths || [], texts:x.texts || {}}) : '');
    renderLookup();
  });
}

/* ================= BOOT ================= */
buildScreens();
if (!restore()) st = fresh();
$('#next').addEventListener('click', function(){ if (canNext()) go(st.i + 1); });
$('#back').addEventListener('click', function(){ if (st.i > 0){ go(st.i - 1); } });
render();
</script>
</body>
</html>
